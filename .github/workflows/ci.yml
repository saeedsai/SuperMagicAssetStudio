name: Regression verification
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Domain, CLI, schema and requirement traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:contracts
      - run: npm test
  browser:
    name: Chromium UI regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:browser
  regression-gate:
    name: Required regression gate
    runs-on: ubuntu-24.04
    needs: [unit, browser]
    if: always()
    steps:
      - run: |
          test '${{ needs.unit.result }}' = 'success'
          test '${{ needs.browser.result }}' = 'success'
