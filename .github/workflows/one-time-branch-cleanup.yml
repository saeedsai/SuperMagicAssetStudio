name: One-time obsolete release branch cleanup
on:
  push:
    branches: [dev]
permissions:
  contents: write
jobs:
  delete-obsolete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the already-merged v5.9.4 release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF="heads/release/ui-menus-v5.9.4"
          echo "Deleting obsolete branch $REF (main and dev are excluded)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${REF}"
