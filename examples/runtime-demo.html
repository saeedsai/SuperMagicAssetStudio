<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Football Sprite Runtime Preview</title>
<style>body{background:#111829;color:#eef2ff;font:15px system-ui;margin:0;padding:28px}main{margin:auto;max-width:800px}h1{font-size:26px}p{color:#a2afca}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0}select,input{padding:9px;border:1px solid #526181;background:#232e46;color:white;border-radius:8px}button{padding:11px;border:0;border-radius:8px;background:#765ee7;color:white;cursor:pointer}.preview{display:grid;place-items:center;background:repeating-conic-gradient(#c6cad4 0 25%,#e5e8ef 0 50%) 0/28px 28px;width:min(95vw,640px);aspect-ratio:1/1;border-radius:8px;overflow:hidden}.preview canvas{width:100%;height:100%}</style>
</head><body><main><h1>Football Sprite Runtime Preview</h1><p>Load your saved project JSON to preview any direction and animation. This page uses the standalone <code>runtime.js</code>, exactly as your game can.</p>
<div class="controls"><label>Project JSON <input id="file" type="file" accept=".json,application/json" /></label><label>View <select id="view"><option value="front">Front</option><option value="back">Back</option><option value="left">Left</option><option value="right">Right</option><option value="threeQuarterFront">3/4 Front</option><option value="threeQuarterBack">3/4 Back</option></select></label><label>Animation <select id="animation"></select></label><button id="play">Pause</button></div>
<div class="preview"><canvas id="canvas" width="768" height="768"></canvas></div><p id="status">No project loaded.</p>
</main><script src="../src/runtime/runtime.js"></script><script>
let character=null,playing=true,begin=performance.now(),frame=0;
const $=id=>document.getElementById(id);
$('file').onchange=async e=>{if(!e.target.files.length)return;try{character=await FootballSpriteCharacter.fromFile(e.target.files[0]);$('animation').innerHTML=character.project.animations.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');begin=performance.now();$('status').textContent=`Loaded ${character.project.projectName} · ${Object.keys(character.project.assets).length} PNG assets`;draw();}catch(err){$('status').textContent=err.message;}};
$('view').onchange=()=>draw();$('animation').onchange=()=>{begin=performance.now();draw();};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';};
function draw(){if(!character)return;const a=$('animation').value;const f=playing?character.frameAtTime(a,performance.now()-begin):frame;frame=f;character.drawToCanvas($('canvas'),{view:$('view').value,animation:a,frame:f});}
function loop(){draw();requestAnimationFrame(loop);}loop();
</script></body></html>
